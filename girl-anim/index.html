<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#FFF1E6">
<title>모모 · 디즈니 12원칙으로 움직이는 소녀</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;overflow:hidden;background:#FFF3EA;color:#5A3A2E;
    font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;
    -webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;touch-action:manipulation}
  #app{position:fixed;inset:0;height:100dvh;display:flex;flex-direction:column;overflow:hidden}

  #stage{position:relative;flex:1 1 auto;min-height:0;
    background:radial-gradient(125% 78% at 50% 04%,#FFFAF4 0%,#FFF0E3 40%,#FFE0CB 70%,#F8C9B1 100%)}
  #stage::after{content:'';position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(58% 34% at 50% 92%,rgba(255,205,175,.55),transparent 72%)}
  .bokeh{position:absolute;border-radius:50%;filter:blur(16px);pointer-events:none;opacity:.55}
  .b1{width:150px;height:150px;left:-40px;top:8%;background:#FFD9C4}
  .b2{width:110px;height:110px;right:-30px;top:22%;background:#DFF3EC}
  .b3{width:180px;height:180px;right:6%;bottom:-40px;background:#FFCFB6;opacity:.45}
  .b4{width:90px;height:90px;left:12%;bottom:12%;background:#FFE6D2;opacity:.7}

  #scene{position:absolute;top:0;bottom:0;left:0;right:0;margin:0 auto;width:100%;height:100%;max-width:600px;display:block}

  .head{position:absolute;left:0;right:0;top:calc(10px + env(safe-area-inset-top));display:flex;flex-direction:column;
    align-items:center;gap:2px;pointer-events:none;z-index:3}
  .head h1{margin:0;font-size:15px;letter-spacing:.14em;font-weight:800;color:#8A5643;opacity:.9}
  .head p{margin:0;font-size:10.5px;letter-spacing:.06em;color:#B0836E}

  .narr{position:absolute;left:50%;top:calc(62px + env(safe-area-inset-top));transform:translate(-50%,-6px);
    padding:6px 13px;border-radius:999px;font-size:11.5px;font-weight:700;letter-spacing:.01em;white-space:nowrap;
    color:#8A4B33;background:rgba(255,255,255,.8);border:1px solid rgba(255,255,255,.9);
    box-shadow:0 6px 18px rgba(190,120,90,.16);opacity:0;transition:opacity .18s,transform .18s;z-index:4;pointer-events:none}
  .narr.on{opacity:1;transform:translate(-50%,0)}

  #panel{position:relative;z-index:5;padding:9px 12px calc(10px + env(safe-area-inset-bottom));
    background:rgba(255,252,249,.82);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    border-top:1px solid rgba(255,255,255,.95);box-shadow:0 -10px 28px rgba(186,124,96,.12)}
  .chips{max-width:520px;margin:0 auto;display:flex;gap:5px;overflow-x:auto;padding:1px 1px 7px;scrollbar-width:none;-ms-overflow-style:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;padding:4px 9px;border-radius:999px;font-size:10.5px;font-weight:700;letter-spacing:.01em;
    color:#B48A76;background:rgba(255,255,255,.72);border:1px solid rgba(230,196,178,.6);
    transition:color .16s,background .16s,border-color .16s,transform .16s}
  .chip.on{color:#fff;background:linear-gradient(180deg,#FF9C7C,#F97B62);border-color:#F98C6F;
    transform:translateY(-1px);box-shadow:0 5px 12px rgba(249,123,98,.35)}
  .row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:440px;margin:0 auto}
  .btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:9px 4px 8px;
    border:none;border-radius:17px;background:linear-gradient(180deg,#FFFFFF,#FFF4EC);
    box-shadow:0 3px 0 rgba(226,183,163,.55),0 8px 16px rgba(196,132,104,.14);
    color:#8A5643;font-family:inherit;font-weight:800;font-size:11.5px;letter-spacing:.02em;cursor:pointer;
    transition:transform .09s,box-shadow .09s}
  .btn .e{font-size:17px;line-height:1}
  .btn:active{transform:translateY(2px) scale(.985);box-shadow:0 1px 0 rgba(226,183,163,.55),0 3px 8px rgba(196,132,104,.12)}
  .btn.busy{animation:pulseBtn .45s ease}
  @keyframes pulseBtn{0%{transform:scale(1)}45%{transform:scale(.95)}100%{transform:scale(1)}}
  .opts{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:8px}
  .opt{padding:4px 11px;border-radius:999px;border:1px solid rgba(230,196,178,.8);background:rgba(255,255,255,.7);
    color:#A87F6C;font-family:inherit;font-size:10.5px;font-weight:700;letter-spacing:.02em;cursor:pointer}
  .opt.on{color:#fff;background:linear-gradient(180deg,#8FD9C8,#5FC2AC);border-color:#74CDB9}

  #sheet{position:fixed;inset:0;z-index:20;display:none;align-items:flex-end;background:rgba(122,80,60,.28)}
  #sheet.on{display:flex}
  .sheetIn{width:100%;max-height:78%;overflow-y:auto;background:#FFFBF7;border-radius:22px 22px 0 0;
    padding:16px 18px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -12px 40px rgba(120,70,50,.24);
    animation:up .22s ease}
  @keyframes up{from{transform:translateY(18px);opacity:.6}to{transform:none;opacity:1}}
  .sheetIn h2{margin:0 0 4px;font-size:14px;color:#7C4B36;letter-spacing:.02em}
  .sheetIn .sub{margin:0 0 12px;font-size:10.5px;color:#B08B78}
  .plist{display:flex;flex-direction:column;gap:7px}
  .pitem{display:flex;gap:9px;align-items:flex-start;font-size:11.5px;line-height:1.42;color:#6F4A39}
  .pitem b{flex:0 0 22px;color:#F0855F;font-variant-numeric:tabular-nums}
  .pitem span{opacity:.92}
  .pitem.dim span{opacity:.5}
  .close{width:100%;margin-top:14px;padding:11px;border:none;border-radius:14px;background:#F98C6F;color:#fff;
    font-family:inherit;font-weight:800;font-size:12.5px;letter-spacing:.04em}
</style>
</head>

var EASE = {
  lin:function(u){return u;},

  out3:function(u){return 1-Math.pow(1-u,3);},
  in3:function(u){return u*u*u;},
  back:function(u){var c=1.9;return 1+(c+1)*Math.pow(u-1,3)+c*Math.pow(u-1,2);},
  backIn:function(u){var c=1.7;return (c+1)*u*u*u-c*u*u;},
  elastic:function(u){ if(u<=0)return 0; if(u>=1)return 1; var p=0.42;
    return Math.pow(2,-9*u)*Math.sin((u-p/4)*(2*Math.PI)/p)+1; }
};
function tw(p, keys){
  if(p<=keys[0][0]) return keys[0][1];
  for(var i=1;i<keys.length;i++){

  }
  return keys[keys.length-1][1];
}
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function osc(p,a,b,cycles){
  if(p<=a||p>=b) return 0;

}

function mkSpring(x,k,d){ return {x:x,v:0,k:k,d:d}; }
function stepSpring(s,target,dt){
  var a=(target-s.x)*s.k - s.v*s.d;
  s.v += a*dt;
  s.x += s.v*dt;
  return s.x;
}

  var el = POOL.pop();
  if(!el){
    el = document.createElementNS('http://www.w3.org/2000/svg','path');
    R.fx.appendChild(el);
  }
  el.setAttribute('d', starPath(size));
  el.setAttribute('fill', color);
  el.style.display='';
  parts.push({el:el,x:x,y:y,vx:vx,vy:vy,rot:rot||0,vr:(Math.random()-0.5)*10,t:0,life:life||1.2,size:size});
}
function burst(n, ox, oy, spread){
  var cols=['#FFD86E','#FFEFAF','#9BE6D6','#FFB0A0','#FFFFFF','#FFC978'];
  for(var i=0;i<n;i++){
    var a=(-Math.PI/2)+(Math.random()-0.5)*spread;
    var sp=90+Math.random()*180;
    spawnStar(ox+(Math.random()-0.5)*note(), oy+(Math.random()-0.5)*10,
      Math.cos(a)*sp, Math.sin(a)*sp,
      5+Math.random()*6, cols[(Math.random()*cols.length)|0],
      Math.random()*Math.PI, 0.9+Math.random()*0.7);
  }
}
function note(){ return 26; }

/* ---------- transform helper ---------- */
function setT(el, ox, oy, rot, sx, sy, dx, dy){
  rot=rot||0; sx=(sx===undefined)?1:sx; sy=(sy===undefined)?1:sy; dx=dx||0; dy=dy||0;
  el.setAttribute('transform','translate('+dx.toFixed(2)+' '+dy.toFixed(2)+') rotate('+rot.toFixed(2)+' '+ox+' '+oy+
    ') translate('+ox+' '+oy+') scale('+sx.toFixed(4)+' '+sy.toFixed(4)+') translate('+(-ox)+' '+(-oy)+')');
}
function num(v){ return (Math.round(v*100)/100); }

/* ---------- state ---------- */
var S = { t:0, last:0, speed:1, act:null, actT:0, actP:0, name:null,
  nextBlink:2.2, blinkT:0, blink:0, idleSeed:Math.random()*10,
  look:0, lookT:0, nextLook:4, glow:0 };

var pose = base();
var prev = base();
var vyRoot = 0, vxRoot = 0;
var CAM = { s:1, mid:344 };

function applyIdle(t){
  var p = base();
  var b = Math.sin(t*1.55 + S.idleSeed);
  var b2 = Math.sin(t*0.72 + S.idleSeed*0.7);
  p.tSY = 1 + b*0.016;
  p.tSX = 1 - b*0.010;
  p.sy = 1 + b*0.008;
  p.sx = 1 - b*0.006;
  p.hDY = b*1.4;
  p.hRot = b2*1.6;
  p.hTilt = b2*1.2;
  p.armL = 7 + Math.sin(t*1.0)*1.6;
  p.armR = -7 - Math.sin(t*1.0+0.4)*1.6;
  p.armLel = -9 - Math.sin(t*0.9)*2;
  p.armRel = 9 + Math.sin(t*0.9+0.3)*2;
  p.dy = Math.sin(t*1.55+S.idleSeed)*1.2;
  p.rot = Math.sin(t*0.5+S.idleSeed)*0.7;
  p.skirtRot = Math.sin(t*0.5+0.6)*0.8;
  p.smile = 0.55 + Math.sin(t*0.6)*0.06;
  p.hairRot = 0;
  p.pupilX = S.look;
  p.pupilY = 0;
  p.blush = 0.4 + Math.sin(t*0.4)*0.06;
  return p;
}

function applyAct(p, name){
  var o = base();
  ACT[name].f(p,o);
  return o;
}

/* ---------- trail ---------- */
var trailPts = [];
function pushTrail(el, t){
  try{
    var m = el.getCTM(), c = R.camera.getCTM();
    if(!m || !c) return;
    var mm = c.inverse().multiply(m);
    var p = document.getElementById('scene').createSVGPoint();
    p.x = parseFloat(el.getAttribute('cx')) || 0;
    p.y = parseFloat(el.getAttribute('cy')) || 0;
    var q = p.matrixTransform(mm);
    trailPts.push({x:q.x,y:q.y,t:t});
  }catch(e){}
}

/* ---------- main loop ---------- */
function frame(now){
  if(!S.last) S.last = now;
  var dt = Math.min((now - S.last)/1000, 0.05);
  S.last = now;
  var sdt = dt * S.speed;
  S.t += sdt;

  /* blink */
  if(S.actT<=0){
    S.nextBlink -= sdt;
    if(S.nextBlink<=0){ S.blinkT = 0.13; S.nextBlink = 2.4 + Math.random()*3; }
  }
  if(S.blinkT>0){ S.blinkT -= sdt; S.blink = 1 - Math.abs(S.blinkT/0.13 - 0.5)*2; }
  else S.blink = 0;

  /* idle look */
  if(S.actT<=0){
    S.nextLook -= sdt;
    if(S.nextLook<=0){ S.lookT = 0; S.nextLook = 3.5+Math.random()*3.5; }
    S.lookT += sdt;
    S.look = Math.sin(S.lookT*1.4)*2.6*Math.max(0, Math.sin(Math.min(S.lookT,1.6)/1.6*Math.PI));
  }

  /* action progress */
  var o;
  if(S.act){
    S.actT += sdt*1000;
    var p = clamp(S.actT/S.act.dur, 0, 1);
    o = applyAct(p, S.act.name);
    S.actP = p;
    if(p>=1){ S.act=null; S.actT=0; S.actP=0; hideNarr(); }
    else updateNarr(p, S.act);
    if(S.act && S.act.name==='sparkle' && S.sparked===false && p>0.37){ S.sparked=true; burst(30, 200, 322, 2.7); burst(12, 200, 300, 1.3); }
  }else{
    o = applyIdle(S.t);
  }
  if(o.eye!==undefined) o.eye = Math.min(o.eye, 1-S.blink*0.94);

  /* root velocity for drag */
  var dyNow = o.dy, dxNow = o.dx;
  vyRoot = (dyNow - prev.dy)/Math.max(dt,0.001);
  vxRoot = (dxNow - prev.dx)/Math.max(dt,0.001);
  prev = o;

  /* secondary springs */
  var headLead = -(o.rot*1.05 + o.hRot*1.4 + o.hTilt*1.1);
  var hairT = headLead + Math.sin(S.t*1.3)*1.2;
  var sideT = headLead*1.3 + o.skirtRot*(-0.5) + Math.sin(S.t*1.1+1)*1.6;
  var skirtT = -(o.rot*0.5) + Math.sin(S.t*0.9)*0.7;
  var liftT = clamp(vyRoot*0.075, -26, 26);
  var hairX = stepSpring(SP.hair, hairT, sdt);
  var sideX = stepSpring(SP.side, sideT, sdt);
  var skirtX = stepSpring(SP.skirt, skirtT, sdt);
  var liftX = stepSpring(SP.lift, liftT, sdt);
  var tailAX = stepSpring(SP.tailA, sideX*1.5 + o.rot*0.4 + Math.sin(S.t*1.9)*2.2, sdt);
  var tailBX = stepSpring(SP.tailB, sideX*1.7 + o.rot*0.5 + Math.sin(S.t*1.6+1.2)*2.6, sdt);

  /* ---- apply to DOM ---- */
  setT(R.mb, 200, 562, o.rot, o.sx, o.sy, o.dx, o.dy);

  var air = clamp(-o.dy/150, 0, 1);
  /* auto-framing camera: keeps her whole body in frame while she stretches & leaps */
  var topY = 562 + (96 - 562)*o.sy + o.dy;
  var spanY = Math.max(300, 592 - topY);
  var sT = Math.min(1, 500/spanY);
  CAM.s += (sT - CAM.s)*0.78;
  R.camera.setAttribute('transform','translate(200 592) scale('+CAM.s.toFixed(4)+') translate(-200 -592)');
  R.shadowWrap.setAttribute('transform','translate(200 568) scale('+(1+air*0.55)+' '+(1-air*0.15)+') translate(-200 -568)');
  R.shadow.setAttribute('opacity', (0.9 - air*0.55).toFixed(3));

  setT(R.torso, 200, 414, o.tRot, o.tSX, o.tSY);
  setT(R.skirt, 200, 404, o.skirtRot + skirtX*0.35, o.skirtSX, o.skirtSY, 0, o.skirtLift);

  /* hair back: pivot at top of head, rotates with head + drag */
  setT(R.hairBack, 200, 130, hairX + o.rot*0.35, (1 - Math.min(0,vyRoot)*0.00035) * (1 + (o.hairSpread||0)*0.22), 1 + Math.abs(liftX)*0.006, 0, liftX*0.5);
  setT(R.sideL, 136, 210, sideX*0.9 + o.hTilt*0.6, 1, 1);
  setT(R.sideR, 264, 210, sideX*0.9 + o.hTilt*0.6, 1, 1);
  setT(R.tailA, 141, 162, tailAX, 1, 1);
  setT(R.tailB, 142, 166, tailBX, 1, 1);

  setT(R.head, 200, 316, o.hRot + o.hTilt, o.hSX, o.hSY, o.hDX, o.hDY);

  setT(R.armL, 156, 330, o.armL, 1, 1);
  setT(R.armLf, 142, 380, o.armLel, 1, 1);
  setT(R.armLh, 135, 426, o.armLwr, 1, 1);
  setT(R.armR, 244, 330, o.armR, 1, 1);
  setT(R.armRf, 258, 380, o.armRel, 1, 1);
  setT(R.armRh, 265, 426, o.armRwr, 1, 1);

  setT(R.legL, 185, 462, o.legL, 1, 1);
  setT(R.legR, 215, 462, o.legR, 1, 1);

  var eo = clamp(o.eye,0.03,1);
  setT(R.eyeL, 168, 234, 0, 1, eo);
  setT(R.eyeR, 232, 234, 0, 1, eo);
  R.happy.setAttribute('opacity', clamp(o.happy,0,1).toFixed(3));
  setT(R.pupilL, 169.5, 242, 0, 1, 1, o.pupilX, o.pupilY);
  setT(R.pupilR, 230.5, 242, 0, 1, 1, o.pupilX, o.pupilY);
  setT(R.irisL, 169.5, 240, 0, 1, 1, o.pupilX*0.45, o.pupilY*0.45);
  setT(R.irisR, 230.5, 240, 0, 1, 1, o.pupilX*0.45, o.pupilY*0.45);
  R.browG.setAttribute('transform','translate(0 '+num(-o.brow*3)+')');
  R.blushL.setAttribute('opacity', clamp(o.blush,0,1).toFixed(3));
  R.blushR.setAttribute('opacity', clamp(o.blush,0,1).toFixed(3));

  var mw = 10.5 + o.smile*2.2;
  var my = 270 - o.smile*1.4;
  if(o.open>0.04){
    var h = 2 + o.open*9;
    R.mouth.setAttribute('d','M'+num(200-mw)+','+num(my)+' Q200,'+num(my-h*0.1)+' '+num(200+mw)+','+num(my));
    R.mouthFill.setAttribute('d','M'+num(200-mw)+','+num(my)+' Q200,'+num(my-h*0.4)+' '+num(200+mw)+','+num(my)+
      ' Q'+num(200+mw*0.6)+','+num(my+h*1.5)+' 200,'+num(my+h*1.2)+' Q'+num(200-mw*0.6)+','+num(my+h*1.5)+' '+num(200-mw)+','+num(my)+' Z');
    R.mouthFill.setAttribute('opacity','1');
  }else{
    R.mouth.setAttribute('d','M'+num(200-mw)+','+num(my)+' Q200,'+num(my+o.smile*7)+' '+num(200+mw)+','+num(my));
    R.mouthFill.setAttribute('opacity','0');
  }

  /* particles */
  updateParts(sdt);

  /* trail */
  var trailSrc = null;
  if(S.act){
    if(S.act.name==='wave') trailSrc = R.trkHandR;
    else if(S.act.name==='jump') trailSrc = R.trkHandL;
    else if(S.act.name==='sparkle') trailSrc = R.trkHandL;
  }
  if(trailSrc && o.trail>0.05) pushTrail(trailSrc, S.t);
  drawTrail();

  requestAnimationFrame(frame);
}

function updateParts(dt){
  for(var i=parts.length-1;i>=0;i--){
    var q = parts[i];
    q.t += dt;
    if(q.t>=q.life){
      q.el.style.display='none';
      POOL.push(q.el);
      parts.splice(i,1);
      continue;
    }
    q.vy += 150*dt;
    q.vx *= (1-1.1*dt);
    q.vy *= (1-0.7*dt);
    q.x += q.vx*dt;
    q.y += q.vy*dt;
    q.rot += q.vr*dt;
    var k = 1 - q.t/q.life;
    q.el.setAttribute('transform','translate('+q.x.toFixed(1)+' '+q.y.toFixed(1)+') rotate('+(q.rot*57.3).toFixed(1)+') scale('+(0.4+k*0.75).toFixed(2)+')');
    q.el.setAttribute('opacity', (k*k).toFixed(3));
  }
}

function drawTrail(){
  var now = S.t;
  while(trailPts.length && now - trailPts[0].t > 0.42) trailPts.shift();
  if(trailPts.length<2){ R.trail.setAttribute('opacity','0'); return; }
  var d='';
  for(var i=0;i<trailPts.length;i++){
    d += (i?' L':'M') + trailPts[i].x.toFixed(1) + ' ' + trailPts[i].y.toFixed(1);
  }
  R.trail.setAttribute('d', d);
  R.trail.setAttribute('opacity','0.5');
}

/* ---------- narration ---------- */
var lastPhaseText = '';
function updateNarr(p, act){
  var ph = null;
  for(var i=0;i<act.phases.length;i++){ if(p>=act.phases[i].a && p<act.phases[i].b){ ph=act.phases[i]; break; } }
  if(!ph){ hideNarr(); return; }
  if(ph.t!==lastPhaseText){
    R.narr.textContent = ph.t;
    R.narr.classList.add('on');
    lastPhaseText = ph.t;
    setChips(ph.c);
  }
}
function hideNarr(){ R.narr.classList.remove('on'); lastPhaseText=''; setChips([]); }
function setChips(list){
  var els = R.chips.children;
  for(var i=0;i<els.length;i++){
    var on = list.indexOf(els[i].getAttribute('data-k'))>=0;
    els[i].classList.toggle('on', on);
  }
}

/* ---------- controls ---------- */
function play(name){
  if(S.act) return;
  S.act = ACT[name];
  S.act.name = name;
  S.actT = 0; S.actP = 0;
  S.sparked = false;
  trailPts.length = 0;
  if(name==='sparkle'){}
}
document.querySelectorAll('.btn').forEach(function(b){
  b.addEventListener('click', function(){
    var n = b.getAttribute('data-act');
    if(S.act) return;
    play(n);
    b.classList.remove('busy'); void b.offsetWidth; b.classList.add('busy');
  });
});
$('slowBtn').addEventListener('click', function(){
  var on = S.speed>0.9;
  S.speed = on ? 0.35 : 1;
  this.classList.toggle('on', on);
  this.textContent = on ? '0.35× 느리게 (켜짐)' : '0.35× 느리게';
});
$('stage').addEventListener('click', function(e){
  if(e.target.closest('.btn')) return;
  var names=['wave','sparkle','jump','spin'];
  if(!S.act) play(names[(Math.random()*names.length)|0]);
});

/* 12 principles sheet */
var PRINCIPLES = [
  ['정지 자세의 원리와 견고한 드로잉','무게중심이 서 있고 실루엣이 읽히는 형태'],
  ['예비동작 (Anticipation)','점프 전 움츠리기, 팔을 들기 전 살짝 내리기'],
  ['무대 설정 (Staging)','캐릭터를 화면 한가운데, 배경은 조용하게'],
  ['스트레이트 어헤드 & 포즈 투 포즈','포즈를 정해 두고 그 사이를 자연스럽게 이어 붙이기'],
  ['따라오기와 겹치는 동작 (Follow Through)','머리카락·리본·치마가 한 박자 늦게 정착'],
  ['슬로우 인 & 슬로우 아웃','움직임의 시작과 끝은 천천히, 가운데는 빠르게'],
  ['호 궤적 (Arcs)','팔·고개가 직선이 아닌 곡선을 그리며 움직임'],
  ['부수동작 (Secondary Action)','손목 흔들기, 눈 깜빡임, 리본 흔들림'],
  ['타이밍 (Timing)','같은 동작도 빠르고 느림으로 의미가 달라짐'],
  ['과장 (Exaggeration)','눌림과 늘어남을 실제보다 크게'],
  ['찌그러짐과 늘어남 (Squash & Stretch)','부피는 유지하며 형태만 눌리고 늘어남'],
  ['매력 (Appeal)','눈에 들어오는 캐릭터의 매력']
];
var plist = $('plist');
PRINCIPLES.forEach(function(p,i){
  var d = document.createElement('div');
  d.className = 'pitem' + ([1,4,5,6,7,8,10].indexOf(i)>=0 ? '' : ' dim');
  d.innerHTML = '<b>'+(i+1)+'</b><span>'+p[0]+' — '+p[1]+'</span>';
  plist.appendChild(d);
});
$('listBtn').addEventListener('click', function(){ $('sheet').classList.add('on'); });
$('closeBtn').addEventListener('click', function(){ $('sheet').classList.remove('on'); });
$('sheet').addEventListener('click', function(e){ if(e.target===$('sheet')) $('sheet').classList.remove('on'); });

/* start */
requestAnimationFrame(function(t){ S.last=t; frame(t); });

/* expose for debugging */
window.__momo = { S:S, play:play, R:R };
})();
</script>
