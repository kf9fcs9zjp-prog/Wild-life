<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f7ecec">
<title>모모 3D — 움직이는 소녀</title>
<style>
  :root{
    --ink:#3b2b31;
    --rose:#c98a9c;
    --rose-deep:#a8637a;
    --paper:#fdf7f4;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;padding:0;height:100%;overflow:hidden;
    background:
      radial-gradient(120% 80% at 50% 0%, #fff9f4 0%, #fbeef0 38%, #ecd9e2 72%, #dcc6d4 100%);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","맑은 고딕",system-ui,sans-serif;
    color:var(--ink);
    -webkit-user-select:none;user-select:none;
    touch-action:none;
  }
  #app{position:fixed;inset:0;}
  canvas{display:block;width:100%;height:100%;touch-action:none;}

  header{
    position:fixed;left:0;right:0;top:0;
    padding:calc(env(safe-area-inset-top,0px) + 16px) 20px 0;
    pointer-events:none;text-align:center;
  }
  header .kicker{
    font-size:11px;letter-spacing:.24em;text-transform:uppercase;
    color:var(--rose-deep);opacity:.75;font-weight:700;
  }
  header h1{
    margin:6px 0 0;font-size:20px;font-weight:800;letter-spacing:-.02em;
  }
  header h1 span{color:var(--rose-deep);}
  header p{
    margin:5px 0 0;font-size:12px;color:#7b6470;opacity:.9;
  }

  #caption{
    position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 118px);
    text-align:center;font-size:12.5px;line-height:1.5;color:#6d5561;
    padding:0 26px;pointer-events:none;
    transition:opacity .3s ease;
  }
  #caption b{color:var(--rose-deep);font-weight:700;}

  #bar{
    position:fixed;left:0;right:0;bottom:0;
    padding:10px 12px calc(env(safe-area-inset-bottom,0px) + 12px);
    display:flex;flex-direction:column;gap:9px;align-items:center;
    background:linear-gradient(to top, rgba(253,247,244,.94) 30%, rgba(253,247,244,0));
  }
  .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;width:100%;max-width:520px;}
  button{
    font:inherit;font-size:14px;font-weight:700;letter-spacing:-.01em;
    border:1px solid rgba(168,99,122,.28);
    background:rgba(255,255,255,.72);
    color:#5c424d;
    padding:11px 16px;border-radius:999px;
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    box-shadow:0 2px 8px rgba(140,90,110,.10);
    transition:transform .12s ease, background .2s ease, color .2s ease, box-shadow .2s ease;
  }
  button:active{transform:scale(.95);}
  button.on{
    background:linear-gradient(180deg,#d79fb0,#b7718a);
    color:#fff;border-color:transparent;
    box-shadow:0 6px 16px rgba(167,99,122,.32);
  }
  button.small{font-size:12.5px;padding:9px 14px;}
  button.small.on{background:linear-gradient(180deg,#b9a3d0,#8e77ad);box-shadow:0 6px 16px rgba(120,90,160,.3);}

  #loading{
    position:fixed;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:14px;
    background:linear-gradient(180deg,#fff9f5,#efdde6);
    z-index:20;transition:opacity .5s ease;
  }
  #loading .ring{
    width:44px;height:44px;border-radius:50%;
    border:3px solid rgba(201,138,156,.25);border-top-color:#b7718a;
    animation:spin 1s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  #loading p{font-size:13px;color:#8d6b78;margin:0;}
  #loading.hide{opacity:0;pointer-events:none;}
  #dl{
    position:fixed;right:14px;top:calc(env(safe-area-inset-top,0px) + 12px);
    font-size:11px;color:#8a6b78;text-decoration:none;
    border-bottom:1px dotted rgba(138,107,120,.5);padding-bottom:1px;opacity:.85;
  }
  @media (max-height:640px){
    header h1{font-size:17px;}
    #caption{bottom:calc(env(safe-area-inset-bottom,0px) + 108px);font-size:11.5px;}
    button{font-size:13px;padding:9px 13px;}
  }
</style>
</head>
<body>
<div id="app"></div>

<header>
  <div class="kicker">Rigged · Animated in 3D</div>
  <h1>모모 <span>3D</span></h1>
  <p>드래그해서 돌려보고, 두 손가락으로 확대해봐</p>
</header>
<a id="dl" href="./girl.glb" download>리깅된 glb 내려받기</a>

<div id="caption"></div>

<div id="bar">
  <div class="row" id="motions"></div>
  <div class="row">
    <button class="small" id="speed">0.35× 느리게</button>
  </div>
</div>

<div id="loading"><div class="ring"></div><p id="loadtxt">모델 불러오는 중…</p></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script>
window.addEventListener('error', (e) => {
  const d = document.createElement('pre');
  d.style.cssText = 'position:fixed;left:0;bottom:0;right:0;z-index:99;margin:0;padding:8px;background:#fff0f0;color:#a00;font-size:11px;white-space:pre-wrap;border-top:1px solid #e0b4b4';
  d.textContent = '⚠ ' + (e.message || e.type) + ' @' + (e.filename||'').split('/').pop() + ':' + e.lineno;
  document.body.appendChild(d);
});
window.addEventListener('unhandledrejection', (e) => {
  const d = document.createElement('pre');
  d.style.cssText = 'position:fixed;left:0;bottom:0;right:0;z-index:99;margin:0;padding:8px;background:#fff0f0;color:#a00;font-size:11px;white-space:pre-wrap;border-top:1px solid #e0b4b4';
  d.textContent = '⚠ ' + (e.reason && (e.reason.stack || e.reason.message) || e.reason);
  document.body.appendChild(d);
});
</script>
<script type="module">
const CLIP_INFO = {
  Idle: ['대기', '가슴으로 숨 쉬고, 무게중심이 좌우로 천천히 옮겨가'],
  Walk: ['걷기', '골반이 먼저 돌고 팔이 반대로 따라와 — 무게가 발에 실려'],
  Run:  ['달리기', '상체를 앞으로 기울이고 무릎을 크게 접어 차올려'],
  Jump: ['점프', '웅크려 예비동작 → 도약 → 공중에서 다리 접기 → 착지'],
  Wave: ['인사', '팔을 어깨 높이로 올리고 손목으로 흔들어'],
  Spin: ['빙글', '제자리에서 한 바퀴, 팔은 원심력처럼 벌려'],
};

const loadingEl = document.getElementById('loading');
const loadTxt = document.getElementById('loadtxt');
const captionEl = document.getElementById('caption');

function fail(msg){
  loadTxt.textContent = msg;
  document.querySelector('#loading .ring').style.display = 'none';
}

let THREE, GLTFLoader, OrbitControls;
try {
  THREE = await import('three');
  ({ GLTFLoader } = await import('three/addons/loaders/GLTFLoader.js'));
  ({ OrbitControls } = await import('three/addons/controls/OrbitControls.js'));
} catch (err) {
  fail('라이브러리를 불러오지 못했어. 새로고침해줄래?');
  throw err;
}

// ---------------------------------------------------------------- scene
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.95;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(30, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0.55, 0.60, 5.35);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.04, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.075;
controls.enablePan = false;
controls.minDistance = 2.4;
controls.maxDistance = 9.0;
controls.minPolarAngle = 0.35;
controls.maxPolarAngle = Math.PI * 0.52;
controls.rotateSpeed = 0.85;
controls.zoomSpeed = 0.8;
controls.update();

// ---------------------------------------------------------------- light
scene.add(new THREE.HemisphereLight(0xfff4ee, 0xcbb2c4, 0.50));
const key = new THREE.DirectionalLight(0xfff2e6, 1.35);
key.position.set(2.4, 3.4, 2.6);
scene.add(key);
const rim = new THREE.DirectionalLight(0xdfd0ff, 0.45);
rim.position.set(-2.6, 2.0, -2.4);
scene.add(rim);
const fill = new THREE.DirectionalLight(0xffe9f0, 0.26);
fill.position.set(-1.4, 0.9, 2.8);
scene.add(fill);

// ---------------------------------------------------------------- soft contact shadow
function shadowTexture(){
  const s = 256;
  const c = document.createElement('canvas');
  c.width = c.height = s;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
  grad.addColorStop(0, 'rgba(126,88,106,0.42)');
  grad.addColorStop(0.45, 'rgba(126,88,106,0.20)');
  grad.addColorStop(1, 'rgba(126,88,106,0)');
  g.fillStyle = grad;
  g.fillRect(0, 0, s, s);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const shadow = new THREE.Mesh(
  new THREE.PlaneGeometry(1.55, 1.55),
  new THREE.MeshBasicMaterial({ map: shadowTexture(), transparent: true, depthWrite: false })
);
shadow.rotation.x = -Math.PI / 2;
shadow.position.y = -0.995;
scene.add(shadow);

// ---------------------------------------------------------------- model
const rig = new THREE.Group();
scene.add(rig);

let mixer = null, actions = {}, current = 'Idle', slow = false, model = null;

const MODEL_VERSION = '20261126g';
const loader = new GLTFLoader();
loader.load('./girl.glb?v=' + MODEL_VERSION, (gltf) => {
  model = gltf.scene;
  model.traverse((o) => {
    if (o.isMesh || o.isSkinnedMesh) {
      o.frustumCulled = false;
      if (o.material) {
        o.material.envMapIntensity = 0.8;
        if (o.material.map) o.material.map.anisotropy = renderer.capabilities.getMaxAnisotropy();
        o.material.needsUpdate = true;
      }
    }
  });
  rig.add(model);

  // frame the character
  const box = new THREE.Box3().setFromObject(model);
  const h = box.max.y - box.min.y;
  const k = 2.0 / h;
  model.scale.setScalar(k);
  model.position.y = -box.min.y * k - 1.0;

  mixer = new THREE.AnimationMixer(model);
  for (const clip of gltf.animations) {
    const a = mixer.clipAction(clip);
    a.enabled = true;
    actions[clip.name] = a;
  }
  mixer.addEventListener('finished', (e) => {
    if (e.action === actions.Jump) { play('Idle', 0.35); }
  });
  play('Idle', 0);
  loadingEl.classList.add('hide');
  setTimeout(() => loadingEl.remove(), 600);
}, (ev) => {
  if (ev.total) loadTxt.textContent = '모델 불러오는 중… ' + Math.round(ev.loaded / ev.total * 100) + '%';
}, (err) => {
  console.error(err);
  fail('모델을 불러오지 못했어. 잠시 뒤 새로고침해줄래?');
});

// ---------------------------------------------------------------- controls UI
const motionsEl = document.getElementById('motions');
const BUTTONS = ['Idle', 'Walk', 'Run', 'Jump', 'Wave', 'Spin'];
const btns = {};
for (const name of BUTTONS) {
  const b = document.createElement('button');
  b.textContent = CLIP_INFO[name][0];
  b.dataset.clip = name;
  b.addEventListener('click', () => play(name, 0.28));
  motionsEl.appendChild(b);
  btns[name] = b;
}

function play(name, fade = 0.25) {
  if (!mixer || !actions[name]) return;
  const next = actions[name];
  if (current === name && next.isRunning() && name !== 'Jump') return;

  const prev = actions[current];
  next.reset();
  next.setEffectiveTimeScale(1);
  next.setEffectiveWeight(1);
  if (name === 'Jump') {
    next.setLoop(THREE.LoopOnce, 1);
    next.clampWhenFinished = true;
  } else {
    next.setLoop(THREE.LoopRepeat, Infinity);
  }
  if (prev && prev !== next && fade > 0) {
    next.crossFadeFrom(prev, fade, false);
  }
  next.play();
  current = name;
  for (const k in btns) btns[k].classList.toggle('on', k === name);
  const [label, desc] = CLIP_INFO[name];
  captionEl.innerHTML = '<b>' + label + '</b> — ' + desc;
}

const speedBtn = document.getElementById('speed');
speedBtn.addEventListener('click', () => {
  slow = !slow;
  speedBtn.classList.toggle('on', slow);
  speedBtn.textContent = slow ? '1× 빠르게' : '0.35× 느리게';
  if (mixer) mixer.timeScale = slow ? 0.35 : 1;
});

// ---------------------------------------------------------------- loop
const clock = new THREE.Clock();
function tick() {
  const dt = Math.min(clock.getDelta(), 0.05);
  if (mixer) mixer.update(dt);
  if (model) {
    // gentle breathing of the contact shadow with vertical motion
    const hips = model.getObjectByName('hips');
    if (hips) {
      const world = new THREE.Vector3();
      hips.getWorldPosition(world);
      const s = 1 - Math.max(0, world.y - 0.05) * 0.35;
      shadow.scale.setScalar(Math.max(0.55, Math.min(1.15, s)));
      shadow.material.opacity = Math.max(0.25, Math.min(1, s));
    }
  }
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
tick();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
});
document.addEventListener('gesturestart', (e) => e.preventDefault());
</script>
</body>
</html>
